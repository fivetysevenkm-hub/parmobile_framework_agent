<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0B1013">
    <title>Luring | PAR Mobile</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100vh; }
        body {
            display: grid; place-items: center; padding: 24px;
            background: #0B1013; color: #D9E0E3;
            font-family: 'Space Grotesk', 'Segoe UI', Tahoma, Arial, sans-serif; text-align: center;
        }
        .card {
            width: min(100%, 380px); padding: 34px 24px 28px;
            border: 1px solid #1C2930; border-radius: 14px; background: #111A1F;
        }
        .badge {
            display: grid; place-items: center; width: 64px; height: 64px; margin: 0 auto 18px;
            border-radius: 50%; background: #22D3EE; color: #0B1013;
            font-size: 34px; font-weight: 900;
        }
        h1 { margin: 0 0 8px; font-size: 1.25rem; color: #E6EEF0; letter-spacing: .04em; }
        p { margin: 0 0 22px; font-size: .88rem; line-height: 1.55; color: #8FA5AD; }
        .btn {
            display: inline-block; padding: 10px 18px; border-radius: 8px;
            background: #22D3EE; color: #0B1013; font-weight: 700; font-size: .85rem;
            text-decoration: none;
        }
        .btn:active { transform: scale(.97); }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">P</div>
        <h1>PAR Mobile — Luring</h1>
        <p>Koneksi Anda sedang terputus atau server tidak dapat dijangkau. Periksa jaringan, lalu coba lagi.</p>
        <a class="btn" href="/dashboard">Coba Lagi</a>
    </div>
</body>
</html>
